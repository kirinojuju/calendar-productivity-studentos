services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: studentos
      POSTGRES_USER: studentos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - studentos_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studentos -d studentos"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  studentos_postgres:
